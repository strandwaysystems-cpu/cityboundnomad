# Builds the site on every push / PR so broken content or config can never
# reach the branch that gets uploaded to Hostinger.
name: astro-build

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Sanity check: dist/.htaccess is what makes every extensionless URL work
      # on Hostinger, and it is easy to lose (it is generated by copying
      # public/, and it is a dotfile). Fail loudly here rather than discover it
      # after an upload.
      - name: Verify .htaccess made it into the build
        run: test -f dist/.htaccess || { echo "::error::dist/.htaccess is missing — extensionless URLs will 404 on Apache"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          # Without this, upload-artifact v4 silently drops dotfiles — which
          # means .htaccess, which means a downloaded artifact deploys as a
          # site where every URL except / returns 404.
          include-hidden-files: true
